<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Intermediate Presentation | FraudLens</title><meta name="description" content="Credit card fraud detection with classical machine learning. Joshua Francis and Logan Digilormo, LSU Shreveport."><style>
:root{--bg:#fbfbfd;--alt:#f5f5f7;--surf:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:rgba(0,0,0,.1);--blue:#0071e3;--green:#248a3d;--orange:#c93400;--red:#d70015;--shadow:0 10px 40px rgba(0,0,0,.08);--ease:cubic-bezier(.28,.11,.32,1)}
[data-theme=dark]{--bg:#000;--alt:#161618;--surf:#1c1c1e;--text:#f5f5f7;--muted:#a1a1a6;--line:rgba(255,255,255,.16);--blue:#2997ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--shadow:0 10px 40px rgba(0,0,0,.5)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
nav{position:sticky;top:0;z-index:10;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc(50% - 490px));background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);font-size:13px}
nav b{font-size:15px}.ib{background:none;border:0;color:var(--text);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:8px}
main{max-width:1100px;margin:0 auto;padding:28px 20px 72px}h1{font-size:30px;letter-spacing:-.02em;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 18px;font-size:15px}
.stage{position:relative;background:var(--surf);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.stage img{display:block;width:100%;height:auto}
.ctl{display:flex;align-items:center;justify-content:space-between;margin:14px 0}.ctl button{background:var(--blue);color:#fff;border:0;border-radius:980px;padding:9px 20px;font-size:15px;cursor:pointer}.ctl button:disabled{opacity:.35;cursor:default}
.ctl span{color:var(--muted);font-variant-numeric:tabular-nums}.th{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:6px}
.th button{padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:none;cursor:pointer;opacity:.75}.th button img{display:block;width:100%;height:auto}.th button.on{border-color:var(--blue);opacity:1}
.dl{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 18px}.dl a{padding:8px 16px;border:1px solid var(--line);border-radius:980px;font-size:14px;color:var(--text)}.dl a:hover{background:var(--alt);text-decoration:none}nav.tabs{gap:18px}nav.tabs .tl{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:center}nav.tabs .tl::-webkit-scrollbar{display:none}
nav.tabs .tl a{white-space:nowrap;padding:6px 12px;border-radius:980px;color:var(--muted);font-size:13px}nav.tabs .tl a:hover{color:var(--text);text-decoration:none;background:var(--alt)}
nav.tabs .tl a.on{color:var(--text);background:var(--alt);font-weight:600}@media(max-width:734px){nav.tabs b{display:none}nav.tabs .tl{justify-content:flex-start}nav.tabs .tl a{display:block!important}}</style></head><body><nav class="tabs" aria-label="Main"><b>FraudLens</b><div class="tl"><a href="index.html">Demo</a><a href="report.html">Final Report</a><a href="proposal.html">Proposal</a><a href="intermediate.html" class=on aria-current=page>Intermediate</a><a href="final.html">Final Presentation</a></div><button class="ib" id="theme" aria-label="Toggle dark mode">◐</button></nav><main><h1>Intermediate progress presentation</h1><p class="sub">Joshua Francis and Logan Digilormo. Use the arrow keys or the buttons to move through the slides.</p><div class="stage"><img id="img" alt="Slide 1" src="slides/intermediate/s-01.jpg"></div><div class="ctl"><button id="prev" aria-label="Previous slide">‹ Previous</button><span id="ct">1 / 12</span><button id="next" aria-label="Next slide">Next ›</button></div><div class="th" id="th"></div></main><script>const setTheme=t=>{document.documentElement.dataset.theme=t;try{localStorage.setItem("fl-theme",t)}catch(e){}};
let st;try{st=localStorage.getItem("fl-theme")}catch(e){}setTheme(st||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
document.getElementById("theme").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");const N=12,slug="intermediate";let i=1;const p=n=>`slides/${slug}/s-${String(n).padStart(2,"0")}.jpg`,$=id=>document.getElementById(id);
$("th").innerHTML=Array.from({length:N},(_,k)=>`<button data-n="${k+1}" aria-label="Slide ${k+1}"><img loading="lazy" src="${p(k+1)}" alt=""></button>`).join("");
function go(n){i=Math.min(N,Math.max(1,n));$("img").src=p(i);$("img").alt="Slide "+i;$("ct").textContent=i+" / "+N;$("prev").disabled=i===1;$("next").disabled=i===N;
 document.querySelectorAll(".th button").forEach(b=>b.classList.toggle("on",+b.dataset.n===i));if(i<N)new Image().src=p(i+1)}
$("prev").onclick=()=>go(i-1);$("next").onclick=()=>go(i+1);$("th").onclick=e=>{const b=e.target.closest("button");if(b)go(+b.dataset.n)};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key===" ")go(i+1);if(e.key==="ArrowLeft")go(i-1)});go(1);</script></body></html>
